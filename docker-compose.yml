# Banco de desenvolvimento idêntico no Windows 10+ (Docker Desktop/WSL2) e no Ubuntu 24.04+
services:
  postgres:
    image: postgres:17-alpine
    container_name: greencode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencode
      POSTGRES_PASSWORD: greencode
      POSTGRES_DB: greencode
    ports:
      - "5432:5432"
    volumes:
      - greencode-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greencode -d greencode"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  greencode-pgdata:
